name: Terminownik - testy, lint i podpisane wydanie

# Wyzwalacz: push na galaz sesji (workflow_dispatch wymaga obecnosci na galezi domyślnej,
# ktorej ta galaz nie spelnia, dlatego podstawowym trybem jest push).
on:
  push:
    branches:
      - 'arena/3c74200e-mein'
    paths:
      - 'terminownik-android/**'
      - '.github/workflows/terminownik-release.yml'
  pull_request:
    paths:
      - 'terminownik-android/**'
      - '.github/workflows/terminownik-release.yml'

permissions:
  # write jest potrzebne wylacznie do publikacji Release z APK i (przy pierwszym buildzie)
  # z prywatnym kluczem podpisywania.
  contents: write

concurrency:
  group: terminownik-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, testy jednostkowe, podpisane APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: terminownik-android

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: JDK 21 (zulu)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Spoijnosc zasobow tekstowych (bez Gradle)
        run: |
          python3 tools/check-strings.py | tee /tmp/strings-check.txt
          # Brakujace klucze albo niezgodna liczba argumentow blokuje wydanie.
          if ! python3 tools/check-strings.py > /dev/null; then
            echo "::error::Kontrola zasobow tekstowych nie przeszla - patrz log powyzej."
            exit 1
          fi

      # Scenariusze logiki biznesowej uruchamia JUnit w kroku "Testy jednostkowe"
      # (DomainScenariosTest -> DomainScenarios.runAll(), 67 scenariuszy).
      # Lokalnie, bez Gradle i bez sieci, ten sam zestaw sprawdza tools/verify-domain.sh.

      - name: Przygotowanie klucza podpisywania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERMINOWNIK_KEYSTORE_BASE64: ${{ secrets.TERMINOWNIK_KEYSTORE_BASE64 }}
          TERMINOWNIK_STORE_PASSWORD: ${{ secrets.TERMINOWNIK_STORE_PASSWORD }}
          TERMINOWNIK_KEY_ALIAS: ${{ secrets.TERMINOWNIK_KEY_ALIAS }}
          TERMINOWNIK_KEY_PASSWORD: ${{ secrets.TERMINOWNIK_KEY_PASSWORD }}
        run: bash scripts/ci-prepare-signing.sh

      - name: Lint (release)
        run: ./gradlew --no-daemon --stacktrace :app:lintRelease

      - name: Testy jednostkowe
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:testReleaseUnitTest

      - name: Zbudowanie podpisanego APK (release)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Weryfikacja artefaktu i podpisu
        id: verify
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::Nie znaleziono APK: $APK"
            exit 1
          fi

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          echo "build-tools: $BUILD_TOOLS"

          {
            echo "## Plik"
            echo '```'
            ls -l "$APK"
            echo '```'
            echo
            echo "## Rozmiar i skrot"
            echo '```'
            SIZE_BYTES=$(stat -c %s "$APK")
            SIZE_MB=$(awk -v b="$SIZE_BYTES" 'BEGIN { printf "%.2f", b/1048576 }')
            echo "rozmiar: $SIZE_BYTES bajtow ($SIZE_MB MiB)"
            sha256sum "$APK"
            echo '```'
            echo
            echo "## apksigner verify --verbose --print-certs"
            echo '```'
            "$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1
            echo '```'
            echo
            echo "## Wersja i pakiety (aapt2)"
            echo '```'
            "$AAPT2" dump badging "$APK" 2>/dev/null | grep -E "package:|sdkVersion|targetSdkVersion|application-label|native-code" || true
            echo '```'
            echo
            echo "## ABI w APK"
            echo '```'
            unzip -l "$APK" | grep -E "lib/" | awk '{print $4}' | cut -d/ -f2 | sort -u || echo "brak bibliotek natywnych w APK"
            echo '```'
          } > /tmp/verify-report.md

          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE_BYTES=$(stat -c %s "$APK")
          VERSION_NAME=$("$AAPT2" dump badging "$APK" 2>/dev/null | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          VERSION_CODE=$("$AAPT2" dump badging "$APK" 2>/dev/null | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)

          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE:-0}" >> "$GITHUB_OUTPUT"

          # Kontrola manifestu: aplikacja nie ma uprawnien sieciowych i nie jest debuggowalna.
          MANIFEST_TXT="/tmp/manifest.txt"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest print "$APK" > "$MANIFEST_TXT" 2>/dev/null || true
          elif [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > "$MANIFEST_TXT" 2>/dev/null || true
          fi

          if [[ -s "$MANIFEST_TXT" ]]; then
            {
              echo
              echo "## Manifest (apkanalyzer) - kontrola prywatnosci"
              echo '```'
              grep -E "uses-permission|android:debuggable|android:name=\"pl.terminownik" "$MANIFEST_TXT" || true
              echo '```'
            } >> /tmp/verify-report.md

            if grep -q "android.permission.INTERNET" "$MANIFEST_TXT"; then
              echo "::error::W manifeście znaleziono INTERNET - aplikacja ma dzialac w pelni offline."
              exit 1
            fi
            if grep -q 'android:debuggable="true"' "$MANIFEST_TXT"; then
              echo "::error::APK release jest debuggowalny (android:debuggable=true)."
              exit 1
            fi
            echo "Kontrola manifestu: OK (brak INTERNET, brak debuggable=true)"
          else
            echo "::warning::apkanalyzer niedostepny - kontrola uprawnien przez aapt2."
            "$AAPT2" dump permissions "$APK" > /tmp/permissions.txt 2>/dev/null || true
            {
              echo
              echo "## Uprawnienia (aapt2 dump permissions)"
              echo '```'
              cat /tmp/permissions.txt
              echo '```'
            } >> /tmp/verify-report.md
            if grep -q "android.permission.INTERNET" /tmp/permissions.txt 2>/dev/null; then
              echo "::error::W uprawnieniach znaleziono INTERNET."
              exit 1
            fi
          fi

          cp "$APK" "terminownik-release.apk"
          echo "$SHA256  terminownik-release.apk" > SHA256SUMS.txt
          cat /tmp/verify-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Podsumowanie testow i lint
        if: always()
        run: |
          set +e
          {
            echo
            echo "## Testy jednostkowe (JUnit)"
            echo '```'
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in sorted(glob.glob('app/build/test-results/*/TEST-*.xml')):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"testy: {total}, nieudane: {failures}, bledy: {errors}, pominięte: {skipped}")
          print("WYNIK:", "PASS" if failures == 0 and errors == 0 and total > 0 else "FAIL")
          PY
            echo '```'
            echo
            echo "## Lint"
            echo '```'
            if [[ -f app/build/reports/lint-results-release.xml ]]; then
              grep -c "<issue" app/build/reports/lint-results-release.xml | xargs -I{} echo "zgloszenia lint: {}"
              grep -o 'severity="[^"]*"' app/build/reports/lint-results-release.xml | sort | uniq -c || true
            else
              echo "brak raportu lint (sprawdz log kroku Lint)"
            fi
            echo '```'
          } > /tmp/tests-summary.md
          cat /tmp/tests-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/tests-summary.md

      - name: Archiwizacja raportow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminownik-raporty
          path: |
            terminownik-android/app/build/reports/lint-results-release.*
            terminownik-android/app/build/reports/tests/**
            terminownik-android/app/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

      - name: Publikacja wydania z APK
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.verify.outputs.version_name }}"
          SHA="${{ steps.verify.outputs.sha256 }}"
          SIZE="${{ steps.verify.outputs.size_bytes }}"
          TAG="terminownik-v${VERSION}"
          APK="terminownik-release.apk"

          {
            echo "# Terminownik ${VERSION} - podpisane wydanie APK"
            echo
            echo "Artefakt zbudowany automatycznie z commitu \`${GITHUB_SHA}\` (galaz \`${GITHUB_REF_NAME}\`)."
            echo
            echo "| Pole | Wartosc |"
            echo "| --- | --- |"
            echo "| Nazwa aplikacji | Terminownik |"
            echo "| Package | \`pl.terminownik.app\` |"
            echo "| Wersja | ${VERSION} (kod ${{ steps.verify.outputs.version_code }}) |"
            echo "| Plik | \`terminownik-release.apk\` |"
            echo "| Rozmiar | ${SIZE} bajtow |"
            echo "| SHA-256 | \`${SHA}\` |"
            echo "| Typ buildu | release (minify + shrinkResources, \`debuggable=false\`) |"
            echo "| Zrodlo klucza | \`${TERMINOWNIK_SIGNING_SOURCE:-unknown}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo
            echo "## Instalacja"
            echo '```'
            echo "adb install -r terminownik-release.apk"
            echo '```'
            echo
            echo "## Weryfikacja podpisu i prywatnosci"
            cat /tmp/verify-report.md
            cat /tmp/tests-summary.md
            echo
            echo "## Ograniczenia tego wydania"
            echo "* Brak dystrybucji sklepowej i platnosci (pelna wersja jako platny plik APK poza sklepami)."
            echo "* Klucz podpisywania: patrz \`RELEASE_CHECKLIST.md\`. Jesli uzyto klucza wygenerowanego przez CI,"
            echo "  przenies go do wlasnego sejfu i ustaw sekrety repozytorium - to udokumentowany bloker produkcyjny."
            echo "* Testy instrumentowane na emulatorze: patrz job \`instrumented\` (best-effort)."
          } > BODY.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" SHA256SUMS.txt BODY.md \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file BODY.md
            echo "Zaktualizowano istniejace wydanie: $TAG"
          else
            gh release create "$TAG" "$APK" SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "Terminownik ${VERSION} - podpisane APK" \
              --notes-file BODY.md
            echo "Utworzono wydanie: $TAG"
          fi

          echo
          echo "Adres wydania: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  instrumented:
    name: Testy instrumentowane (emulator, best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Emulatory na runnerach GitHub bywaja niestabilne - porazka nie blokuje wydania,
    # ale jest raportowana uczciwie (nie oznaczamy nieuruchomionych testow jako zaliczonych).
    continue-on-error: true
    needs: verify
    defaults:
      run:
        working-directory: terminownik-android

    strategy:
      fail-fast: false
      matrix:
        api_level: [30, 34]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Uruchomienie testow na emulatorze (API ${{ matrix.api_level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
          working-directory: terminownik-android

      - name: Raport z testow instrumentowanych
        if: always()
        run: |
          set +e
          {
            echo "## Testy instrumentowane - API ${{ matrix.api_level }}"
            echo '```'
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in sorted(glob.glob('app/build/outputs/androidTest-results/connected/**/TEST-*.xml', recursive=True)):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"testy: {total}, nieudane: {failures}, bledy: {errors}, pominięte: {skipped}")
          print("WYNIK:", "PASS" if total > 0 and failures == 0 and errors == 0 else ("NIE URUCHOMIONO" if total == 0 else "FAIL"))
          PY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Archiwizacja wynikow instrumentowanych
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminownik-testy-instrumentowane-api${{ matrix.api_level }}
          path: terminownik-android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 30
